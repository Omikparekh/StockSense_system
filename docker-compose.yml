version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stocksense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksense_pass}
      POSTGRES_DB: ${POSTGRES_DB:-stocksense_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocksense_user} -d ${POSTGRES_DB:-stocksense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksense_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stocksense_user}:${POSTGRES_PASSWORD:-stocksense_pass}@db:5432/${POSTGRES_DB:-stocksense_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_stocksense_jwt_signing_key_change_in_production_12345}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocksense_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
